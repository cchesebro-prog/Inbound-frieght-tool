name = "inbound-freight-tool"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Explicit so `wrangler deploy` doesn't warn about relying on defaults.
# workers_dev = true: this Worker is currently only reachable at the
# *.workers.dev subdomain (no custom domain configured yet). It's still
# safe to expose — every /api/* route other than /api/login requires an
# authenticated session cookie.
workers_dev = true
# preview_urls = false: don't generate separate public preview URLs for
# non-production versions.
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "inbound-freight-tool-db"
database_id = "acbc7790-3593-4917-ad72-c4d0712010b9"

[assets]
directory = "./public"
binding = "ASSETS"

# Not secret — the contract-based REST endpoint version, confirmed live
# against Wigwam's Acumatica 2025R2 instance (FR-6.1 PO matching). Safe to
# commit; only the OAuth credentials and site URL below are secrets.
[vars]
ACUMATICA_ENDPOINT_VERSION = "25.200.001"

# Secrets — set with `wrangler secret put <NAME>`, never committed here:
#   ANTHROPIC_API_KEY          Claude API key used server-side for shipment extraction
#   SESSION_SECRET             HMAC key used to sign session cookies
#   ACUMATICA_BASE_URL         Acumatica site root, e.g. https://acm.wigwam.com (FR-6.1 PO matching, see README.md)
#   ACUMATICA_CLIENT_ID        OAuth 2.0 client-credentials client ID
#   ACUMATICA_CLIENT_SECRET    OAuth 2.0 client-credentials client secret
#   ADMIN_RESET_TOKEN          Shared secret for POST /api/admin/reset-lock (clears a stuck batch-operations lock)
